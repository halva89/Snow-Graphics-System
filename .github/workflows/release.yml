name: Release builds

on:
  workflow_dispatch:        # запуск вручную из вкладки Actions
  push:
    tags:
      - 'v*'                # сработает при создании тега вида v1.2.3

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: main_frame-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: main_frame-linux-aarch64
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: main_frame-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Локальный build.rs трогать не нужно: .spv уже закоммичены,
      # а сборка идёт через cargo build --target.

      - name: Install Linux system deps (GLFW/X11 headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libvulkan-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev wayland-protocols libwayland-dev

      - name: Build (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}/shaders
          cp target/${{ matrix.target }}/release/main_frame dist/${{ matrix.artifact }}/main_frame${{ runner.os == 'Windows' && '.exe' || '' }}
          cp shaders/*.spv dist/${{ matrix.artifact }}/shaders/
          cd dist
          zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.zip