<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS Wiki - Экосистема</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar-container"></div>

<div class="content">
    <h1>Экосистема SGS</h1>
    
    <h2 id="sgs">SGS</h2>
    <p>
        Snow Graphics System — ядро движка. Отвечает за рендеринг и логику.
    </p>
    
    <h2 id="sgss">SGSS</h2>
    <p>
        <code>.sgss</code> — формат сцен. Текстовый файл, описывающий объекты и анимации.
    </p>
    
    <h2 id="editor">SGSS Editor</h2>
    <p>
        Визуальный редактор для создания .sgss файлов. Позволяет рисовать и сохранять сцены.
    </p>
    
    <hr>
    
    <div class="footer">
        SGS Wiki — Snow Graphics System
    </div>
</div>

<script>
    fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('sidebar-container').innerHTML = data;
            const current = window.location.pathname.split('/').pop();
            document.querySelectorAll('.sidebar-link, .sidebar-link-sub').forEach(link => {
                if (link.getAttribute('href') === current) {
                    link.classList.add('active');
                }
            });
        });
</script>
</body>
</html>
